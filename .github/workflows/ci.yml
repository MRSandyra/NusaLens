name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-safe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --group dev --frozen
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Type check
        run: uv run mypy src/nusalens
      - name: Unit tests
        run: uv run pytest -m "not integration and not safe_integration" -q
      - name: Safe HTTP integration tests
        run: uv run pytest -m safe_integration -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v2
