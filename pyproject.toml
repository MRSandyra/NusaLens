[project]
name = "nusalens"
version = "0.1.0"
description = "Indonesian public data analytics assistant: hybrid RAG, text-to-SQL, and MCP server, local and free"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "psycopg[binary,pool]>=3.1",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "datasets>=2.19",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.35",
    "psutil>=5.9",
    "sqlglot>=30.20",
    "llama-cpp-python>=0.3.35",
    "matplotlib>=3.11.2",
    "accelerate>=1.1.0",
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nusalens"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
